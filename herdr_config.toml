onboarding = false

[ui]
agent_panel_sort = "priority"
sidebar_width = 32        # Set your preferred sidebar width (columns)
sidebar_min_width = 24    # Prevents it from collapsing too narrow

[ui.sidebar.spaces]
row_gap = 0               # Compact spacing for the Spaces list

[ui.sidebar.agents]
row_gap = 0               # Compact spacing for the Agents list

[session]
# Restore saved workspaces/panes and resume supported agent conversations
# (Claude-integration panes) when the server starts — e.g. on boot via the
# herdr.service systemd --user unit. This is herdr's default; set explicitly.
resume_agents_on_restore = true

[theme]
name = "catppuccin"
auto_switch = false
